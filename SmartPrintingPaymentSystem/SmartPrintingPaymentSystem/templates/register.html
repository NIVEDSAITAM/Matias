{% extends "base.html" %}{% block content %}
<div class="auth-page narrow-page"><span class="eyebrow">STUDENT SIDE</span><h1>Create an Account</h1>
<div class="card">
<form method="post">
<label>Name</label><input name="name" required>
<label>Student ID</label><input name="student_id" required>
<label>Email</label><input type="email" name="email" required>
<label>Password</label><input type="password" name="password" minlength="6" required>
<button class="btn wide">Register</button>
</form>
<p>Already have an account? <a href="{{url_for('login')}}">Login</a></p>
</div></div>{% endblock %}
